<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f786b">
  <meta name="description" content="Darlete Stoffel, psicoterapeuta. Acesse o WhatsApp, Instagram e materiais gratuitos.">
  <title>Darlete Stoffel | Psicoterapeuta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:#0d786a;
      --green-dark:#07594f;
      --green-soft:#eaf4f1;
      --rose:#d66d7a;
      --cream:#fbfaf6;
      --ink:#23413c;
      --muted:#6c7f7a;
      --line:#e5ece9;
      --white:#ffffff;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      font-family:"DM Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(214,109,122,.08), transparent 28rem),
        radial-gradient(circle at 100% 20%, rgba(13,120,106,.08), transparent 30rem),
        var(--cream);
      padding:26px 14px 42px;
    }
    .shell { width:min(100%, 560px); margin:0 auto; }
    .card {
      overflow:hidden;
      background:rgba(255,255,255,.97);
      border:1px solid var(--line);
      border-radius:30px;
      box-shadow:0 18px 55px rgba(22,67,58,.10);
    }
    .hero {
      position:relative;
      height:105px;
      background:linear-gradient(180deg, rgba(13,120,106,.07), rgba(255,255,255,0));
      overflow:visible;
    }
    .avatar-card {
      position:absolute;
      left:50%;
      bottom:-48px;
      transform:translateX(-50%);
      z-index:2;
      width:96px;
      height:96px;
      border-radius:50%;
      overflow:hidden;
      border:5px solid rgba(255,255,255,.98);
      box-shadow:0 10px 28px rgba(9,53,47,.16);
      background:#fff;
    }
    .avatar-card img {
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 26%;
      display:block;
    }
    .brand-mini { display:flex; justify-content:center; margin:10px 0 0; }
    .brand-mini img { width:120px; max-width:42%; opacity:.88; }
    .content { padding:62px 24px 26px; text-align:center; }
    h1 {
      margin:0;
      font-family:"Playfair Display", Georgia, serif;
      color:var(--green-dark);
      font-size:clamp(2rem,7vw,2.7rem);
      line-height:1.05;
      letter-spacing:-.02em;
    }
    .role {
      margin:8px 0 0;
      color:var(--green);
      text-transform:uppercase;
      font-size:.78rem;
      letter-spacing:.24em;
      font-weight:700;
    }
    .intro {
      max-width:430px;
      margin:18px auto 24px;
      color:var(--muted);
      line-height:1.65;
      font-size:.98rem;
    }
    .links { display:grid; gap:12px; }
    .btn {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:56px;
      padding:14px 18px;
      border-radius:17px;
      text-decoration:none;
      font-weight:700;
      font-size:.98rem;
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
      cursor:pointer;
      border:1px solid transparent;
    }
    .btn:hover { transform:translateY(-1px); }
    .btn.primary {
      background:var(--green);
      color:var(--white);
      box-shadow:0 9px 22px rgba(13,120,106,.18);
    }
    .btn.primary:hover { background:var(--green-dark); }
    .btn.secondary {
      background:var(--white);
      color:var(--green-dark);
      border-color:var(--line);
    }
    .btn.secondary:hover { background:var(--green-soft); }
    .btn.ebook {
      background:#fff7f8;
      color:#9b4f59;
      border-color:#f1d7db;
    }
    .btn.ebook:hover { background:#fcecef; }
    .icon { width:21px; height:21px; flex:0 0 auto; }
    footer {
      padding:16px 8px 0;
      text-align:center;
      color:#8b9b96;
      font-size:.74rem;
    }
    @media (max-width:420px) {
      body { padding:0; background:var(--white); }
      .shell { width:100%; }
      .card { border:0; border-radius:0; box-shadow:none; min-height:100vh; }
      .content { padding:60px 18px 28px; }
      .avatar-card { width:88px; height:88px; bottom:-44px; }
      footer { display:none; }
    }
  </style>
</head>
