<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f786b">
  <meta name="description" content="Darlete Stoffel, psicoterapeuta. Acesse o WhatsApp, Instagram e materiais gratuitos.">
  <title>Darlete Stoffel | Psicoterapeuta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:#0d786a;
      --green-dark:#07594f;
      --green-soft:#eaf4f1;
      --rose:#d66d7a;
      --cream:#fbfaf6;
      --ink:#23413c;
      --muted:#6c7f7a;
      --line:#e5ece9;
      --white:#ffffff;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      font-family:"DM Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(214,109,122,.08), transparent 28rem),
        radial-gradient(circle at 100% 20%, rgba(13,120,106,.08), transparent 30rem),
        var(--cream);
      padding:26px 14px 42px;
    }
    .shell { width:min(100%, 560px); margin:0 auto; }
    .card {
      overflow:hidden;
      background:rgba(255,255,255,.97);
      border:1px solid var(--line);
      border-radius:30px;
      box-shadow:0 18px 55px rgba(22,67,58,.10);
    }
    .hero {
      position:relative;
      height:105px;
      background:linear-gradient(180deg, rgba(13,120,106,.07), rgba(255,255,255,0));
      overflow:visible;
    }
    .avatar-card {
      position:absolute;
      left:50%;
      bottom:-48px;
      transform:translateX(-50%);
      z-index:2;
      width:96px;
      height:96px;
      border-radius:50%;
      overflow:hidden;
      border:5px solid rgba(255,255,255,.98);
      box-shadow:0 10px 28px rgba(9,53,47,.16);
      background:#fff;
    }
    .avatar-card img {
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 26%;
      display:block;
    }
    .brand-mini { display:flex; justify-content:center; margin:10px 0 0; }
    .brand-mini img { width:120px; max-width:42%; opacity:.88; }
    .content { padding:62px 24px 26px; text-align:center; }
    h1 {
      margin:0;
      font-family:"Playfair Display", Georgia, serif;
      color:var(--green-dark);
      font-size:clamp(2rem,7vw,2.7rem);
      line-height:1.05;
      letter-spacing:-.02em;
    }
    .role {
      margin:8px 0 0;
      color:var(--green);
      text-transform:uppercase;
      font-size:.78rem;
      letter-spacing:.24em;
      font-weight:700;
    }
    .intro {
      max-width:430px;
      margin:18px auto 24px;
      color:var(--muted);
      line-height:1.65;
      font-size:.98rem;
    }
    .links { display:grid; gap:12px; }
    .btn {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:56px;
      padding:14px 18px;
      border-radius:17px;
      text-decoration:none;
      font-weight:700;
      font-size:.98rem;
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
      cursor:pointer;
      border:1px solid transparent;
    }
    .btn:hover { transform:translateY(-1px); }
    .btn.primary {
      background:var(--green);
      color:var(--white);
      box-shadow:0 9px 22px rgba(13,120,106,.18);
    }
    .btn.primary:hover { background:var(--green-dark); }
    .btn.secondary {
      background:var(--white);
      color:var(--green-dark);
      border-color:var(--line);
    }
    .btn.secondary:hover { background:var(--green-soft); }
    .btn.ebook {
      background:#fff7f8;
      color:#9b4f59;
      border-color:#f1d7db;
    }
    .btn.ebook:hover { background:#fcecef; }
    .icon { width:21px; height:21px; flex:0 0 auto; }
    footer {
      padding:16px 8px 0;
      text-align:center;
      color:#8b9b96;
      font-size:.74rem;
    }
    @media (max-width:420px) {
      body { padding:0; background:var(--white); }
      .shell { width:100%; }
      .card { border:0; border-radius:0; box-shadow:none; min-height:100vh; }
      .content { padding:60px 18px 28px; }
      .avatar-card { width:88px; height:88px; bottom:-44px; }
      footer { display:none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="hero">
        <div class="avatar-card">
          <img src="darlete.jpg" alt="Darlete Stoffel">
        </div>
      </div>
      <div class="content">
        <h1>Darlete Stoffel</h1>
        <p class="role">Psicoterapeuta</p>
        <div class="brand-mini">
          <img src="logo.jpg" alt="Logotipo Darlete Stoffel">
        </div>
        <p class="intro">
          Um espaço de escuta e acompanhamento para você compreender melhor o que está vivendo e cuidar de si com mais clareza.
        </p>
        <div class="links">
          <a id="whatsappBtn" class="btn primary" href="#" target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M20.52 3.48A11.79 11.79 0 0 0 12.11 0C5.62 0 .34 5.28.34 11.77c0 2.08.54 4.11 1.58 5.9L.24 23.8l6.28-1.65a11.75 11.75 0 0 0 5.58 1.42h.01c6.48 0 11.76-5.28 11.76-11.77 0-3.14-1.19-6.09-3.35-8.32ZM12.11 21.6h-.01a9.77 9.77 0 0 1-4.98-1.36l-.36-.21-3.73.98 1-3.64-.23-.37a9.8 9.8 0 1 1 8.31 4.6Zm5.38-7.35c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.53.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.08-.15-.67-1.61-.92-2.21-.24-.57-.49-.49-.67-.5h-.57c-.2 0-.53.08-.8.38-.27.3-1.04 1.01-1.04 2.46s1.06 2.86 1.2 3.05c.15.2 2.08 3.18 5.04 4.46.7.3 1.25.49 1.68.62.71.22 1.35.19 1.86.12.57-.08 1.75-.72 2-1.42.25-.7.25-1.3.17-1.42-.07-.11-.27-.18-.57-.33Z"/>
            </svg>
            Agendar ou tirar dúvidas pelo WhatsApp
          </a>
          <a id="ebookBtn" class="btn ebook" href="#" target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>
            </svg>
            Baixar e-book gratuito
          </a>
          <a id="instagramBtn" class="btn secondary" href="#" target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
            </svg>
            Acompanhar no Instagram
          </a>
        </div>
      </div>
    </section>
    <footer>© Darlete Stoffel</footer>
  </main>
  <script src="config.js"></script>
  <script>
    const cfg = window.DARLETE_CONFIG || {};
    const whatsappBtn = document.getElementById("whatsappBtn");
    const instagramBtn = document.getElementById("instagramBtn");
    const ebookBtn = document.getElementById("ebookBtn");
    whatsappBtn.href = cfg.whatsappUrl || "#";
    instagramBtn.href = cfg.instagramUrl || "#";
    if (cfg.ebookUrl && cfg.ebookUrl.trim()) {
      ebookBtn.href = cfg.ebookUrl.trim();
    } else {
      ebookBtn.addEventListener("click", function(event) {
        event.preventDefault();
        alert("O e-book ainda será disponibilizado.");
      });
    }
  </script>
</body>
</html>
